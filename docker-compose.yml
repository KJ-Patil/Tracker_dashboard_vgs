version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vgs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: vgs_dashboard
    ports:
      - "5432:5432"
    volumes:
      - vgs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vgs_pgdata:
